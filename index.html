<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loot RPG - Profissional</title>

<style>
    
.upload-container {
    display:none;
}
    
body {
    margin:0;
    font-family:'Cinzel', serif;
    color:#ddd;

    background-image: url("./background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.box {
    background: rgba(10,10,20,0.75);
    backdrop-filter: blur(6px);

    border:1px solid rgba(150,0,255,0.3);
    border-radius:12px;

    box-shadow:0 0 15px rgba(140,0,255,0.3);
    transition:0.3s;
}

/* HEADER */
header {
    text-align:center;
    padding:20px;
    font-size:26px;
    font-weight:bold;
}

/* TOPO */
.topo {
    display:flex;
    justify-content:center;
}

/* GRID */
.main-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

/* COLUNA DIREITA */
.main-grid > div:last-child {
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* BOTÕES */
button {
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
    margin:3px;
    background:#333;
    color:#fff;
    border:1px solid #555;
}

button:hover {
    background:#555;
}

/* BOTÃO LIMPAR */
.limpar-btn {
    background:#550000;
    border:1px solid #aa0000;
}

.limpar-btn:hover {
    background:#aa0000;
}

/* INPUTS */
input,select {
    padding:6px;
}

/* RESULTADO */
.result {
    margin-top:10px;
    font-size:18px;
}

/* HISTÓRICO */
textarea {
    width:100%;
    height:150px;
    background:#000;
    color:#0f0;
    font-family:monospace;
}

/* TABELAS GRID */
.tabelas-grid {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

/* BOTÕES TABELA */
.tabela-btn {
    padding:12px 20px;
    font-weight:bold;
    border:2px solid #aaa;
    cursor:pointer;
    min-width:120px;
    text-align:center;
}

.tabela-btn.active {
    border:2px solid #fff;
    box-shadow:0 0 10px #fff;
}

/* CORES */
.cobre { background:#6b3e1e; }
.bronze { background:#a97142; }
.prata { background:#aaa; color:#000; }
.ouro { background:#ffd700; color:#000; }
.platina { background:#00aaff; }
.adamantina { background:#00cc66; }
.mythril { background:#3366ff; }

/* GRID DE UPLOAD */
.upload-grid {
    display: flex;
    gap: 30px;
    justify-content: center;
}

/* CAIXAS */
.upload-box {
    background: #1a1a1a;
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid #333;
    text-align: center;
}

/* TÍTULO */
.upload-box h4 {
    margin: 5px 0 10px;
    font-size: 14px;
    color: #ccc;
}

/* CONTAINER GERAL */
.upload-container {
    display: flex;
    align-items: center;
    gap: 30px;
    padding: 10px 20px;
}

/* LADO ESQUERDO */
.upload-left {
    min-width: 180px;
}

/* CARDS */
.upload-cards {
    display: flex;
    gap: 20px;
}

/* CARD INDIVIDUAL */
.upload-card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 15px 20px;
    min-width: 260px;
}

/* TÍTULO */
.upload-card h4 {
    margin-bottom: 10px;
    font-size: 14px;
    color: #ccc;
}

/* NOME DO ARQUIVO */
.file-name {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #aaa;
}

/* STATUS */
.status {
    margin-left: 20px;
    margin-top: 5px;
    font-size: 14px;
}

.status.ok {
    color: #00ff88;
}

.status.erro {
    color: #ff4444;
}

.main-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    padding:20px;
    max-width:1200px;
    margin:auto;
    position:relative;
}

/* linha divisória */
.main-grid::after {
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:1px;
    background:#444;
}

.tabelas-grid {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
}

.tabela-btn {
    min-width:110px;
    padding:10px;
    border:2px solid #aaa;
    font-weight:bold;
}

/* efeito visual mais forte */
.tabela-btn.active {
    border:2px solid #fff;
    box-shadow:0 0 8px #fff;
}

.linha-acao {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:15px 0;
}

.result {
    margin-top:20px;
    font-size:20px;
    text-align:center;
}

.result strong {
    font-size:22px;
}

textarea {
    width:100%;
    height:180px;
    background:#050505;
    color:#0f0;
    font-family:monospace;
    border:1px solid #333;
    padding:10px;
}

.box {
    transition:0.2s;
}

.box:hover {
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(255,255,255,0.1);
}

/* EFEITO SHADOWFELL */
/* névoa animada */
body::before {
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: radial-gradient(circle, rgba(80,0,120,0.15) 0%, transparent 60%);
    animation: fog 20s linear infinite;
    z-index:-1;
}

@keyframes fog {
    0% { transform: translate(0,0); }
    50% { transform: translate(-10%, -10%); }
    100% { transform: translate(0,0); }
}

header {
    text-align:center;
    padding:25px;
    font-size:32px;
    font-weight:bold;
    letter-spacing:2px;
    color:#c084ff;
    text-shadow:0 0 10px #6a00ff, 0 0 20px #3a0066;
}

.box {
    background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
    border:1px solid #2a2a2a;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 10px rgba(100,0,150,0.2);
    transition:0.3s;
}

.box:hover {
    transform:scale(1.03);
    box-shadow:0 0 25px rgba(140,0,255,0.5);
}

button {
    background: linear-gradient(145deg, #2a003f, #14001f);
    border:1px solid #5a00aa;
    color:#fff;
    font-weight:bold;
    transition:0.2s;
}

button:hover {
    background:#5a00aa;
    box-shadow:0 0 15px #7a00ff;
}

.result {
    margin-top:20px;
    font-size:22px;
    color:#e0b3ff;
    text-shadow:0 0 10px #8000ff;
}

textarea {
    background:#050005;
    color:#bb66ff;
    border:1px solid #5500aa;
    font-family:monospace;
    padding:10px;
    box-shadow:inset 0 0 10px #220033;
}

.tabela-btn {
    border:2px solid #444;
    color:#ccc;
}

.tabela-btn:hover {
    transform:scale(1.05);
    box-shadow:0 0 10px #888;
}

.tabela-btn.active {
    border:2px solid #c084ff;
    box-shadow:0 0 15px #a855f7;
    color:#fff;
}

/* LOGO */
.logo-guilda {
    position:fixed;
    top:10px;
    right:20px;
    width:90px;

    z-index:999;

    filter: drop-shadow(0 0 10px red)
            drop-shadow(0 0 20px #ff0000);

    transition:0.3s;
}

.logo-guilda:hover {
    transform:scale(1.1) rotate(-2deg);
    filter: drop-shadow(0 0 15px red)
            drop-shadow(0 0 30px #ff0000);
}

header {
    padding-right:120px;
}

.logo-guilda {
    animation: pulseGlow 3s infinite alternate;
}

@keyframes pulseGlow {
    from { filter: drop-shadow(0 0 10px red); }
    to { filter: drop-shadow(0 0 25px red); }
}
</style>
</head>

<body>

<header>🎲 Loot RPG - Plano das Sombras</header>
<img src="logo.png" class="logo-guilda">
<div class="main-grid">

<!-- ESQUERDA -->
<div class="box">
<h3>Tabelas</h3>

<h4 id="tabelaAtual">Tabela: -</h4>

<select id="tabelaSelect" style="display:none;"></select>
<div id="tabelasBotoes" class="tabelas-grid"></div>

<br>

<button onclick="rolarDado()">🎲 Rolar d100</button>
<input id="numero" type="number" min="1" max="100">
<button onclick="buscarManual()">Buscar</button>

<div id="resultado" class="result"></div>

<h4>Histórico</h4>
<button class="limpar-btn" onclick="limparHistorico('historico')">🧹 Limpar</button>
<textarea id="historico"></textarea>
</div>

<!-- DIREITA -->
<div>

<div class="box">
<h3>Subtabelas</h3>

<select id="subSelect"></select>

<br><br>

<button onclick="rolarSub()">🎲 Rolar</button>
<input id="subNumero" type="number">
<button onclick="buscarSub()">Buscar</button>

<div id="subResultado" class="result"></div>

<h4>Histórico</h4>
<button class="limpar-btn" onclick="limparHistorico('historicoSub')">🧹 Limpar</button>
<textarea id="historicoSub"></textarea>
</div>

<div class="box">
<h3>Ouro</h3>

<input id="x" value="1" size="3"> d
<select id="dado">
<option>d4</option><option>d6</option><option>d8</option>
<option>d10</option><option>d12</option><option>d20</option><option>d100</option>
</select>
+ <input id="bonus" value="0" size="3">

<br><br>

<button onclick="rolarOuro()">Rolar</button>
<div id="ouro" class="result"></div>
</div>

</div>

</div>

<script>
let tabelas = {};
let subtabelas = {};

let mainLoaded=false, subLoaded=false;

function atualizarSelects(){
    const container=document.getElementById("tabelasBotoes");
    const tabelaSelect=document.getElementById("tabelaSelect");
    const subSelect=document.getElementById("subSelect");

    container.innerHTML="";
    tabelaSelect.innerHTML="";
    subSelect.innerHTML="";

    Object.keys(tabelas).forEach((nome,i)=>{
        let opt=new Option(nome,nome);
        tabelaSelect.add(opt);

        let btn=document.createElement("div");
        btn.className="tabela-btn "+nome.toLowerCase().split(" ")[0];
        btn.innerText=nome;

        btn.onclick=()=>{
            document.querySelectorAll(".tabela-btn").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            tabelaSelect.value=nome;
            document.getElementById("tabelaAtual").innerText="Tabela: "+nome;
        };

        if(i===0){
            btn.classList.add("active");
            tabelaSelect.value=nome;
        }

        container.appendChild(btn);
    });

    Object.keys(subtabelas).forEach((nome,i)=>{
        let opt=new Option(nome,nome);
        subSelect.add(opt);
        if(i===0) subSelect.value=nome;
    });
}

function buscarResultado(valor){
    let tabela=tabelas[document.getElementById("tabelaSelect").value];
    if(!tabela) return "⚠️ Nenhuma tabela";
    return tabela.find(l=>valor>=l.min && valor<=l.max)?.resultado || "Não encontrado";
}

function rolarDado(){
    let n=Math.floor(Math.random()*100)+1;
    document.getElementById("numero").value=n;
    let r=buscarResultado(n);
    document.getElementById("resultado").innerText=`🎲 ${n} → ${r}`;
    addHistorico(`🎲 ${n} → ${r}`,"historico");
}

function buscarManual(){
    let n=parseInt(document.getElementById("numero").value);
    let r=buscarResultado(n);
    document.getElementById("resultado").innerText=`🔎 ${n} → ${r}`;
    addHistorico(`🔎 ${n} → ${r}`,"historico");
}

function rolarSub(){
    let lista=subtabelas[document.getElementById("subSelect").value];
    let n=Math.floor(Math.random()*lista.length);
    let r=lista[n];
    document.getElementById("subNumero").value=n+1;
    document.getElementById("subResultado").innerText=r;
    addHistorico(`🎲 ${n+1} → ${r}`,"historicoSub");
}

function buscarSub(){
    let lista=subtabelas[document.getElementById("subSelect").value];
    let n=parseInt(document.getElementById("subNumero").value)-1;
    let r=lista[n];
    document.getElementById("subResultado").innerText=r;
    addHistorico(`🔎 ${n+1} → ${r}`,"historicoSub");
}

function rolarOuro(){
    let x=+document.getElementById("x").value;
    let d=+document.getElementById("dado").value.replace("d","");
    let b=+document.getElementById("bonus").value;

    let total=0, rolls=[];
    for(let i=0;i<x;i++){
        let r=Math.floor(Math.random()*d)+1;
        rolls.push(r);
        total+=r;
    }

    total+=b;

    document.getElementById("ouro").innerText=
        `💰 [${rolls.join(", ")}] + ${b} = ${total} PO`;
}

function addHistorico(texto,id){
    let campo=document.getElementById(id);
    let linhas=campo.value.split("\n");
    linhas.unshift(texto);
    campo.value=linhas.slice(0,50).join("\n");
}

function limparHistorico(id){
    document.getElementById(id).value="";
}
    
async function carregarDados(){
    try{
        const resMain = await fetch("tabelas.json");
        const resSub = await fetch("subtabelas.json");

        if(!resMain.ok || !resSub.ok){
            throw new Error("Erro ao carregar JSON");
        }

        tabelas = await resMain.json();
        subtabelas = await resSub.json();

        atualizarSelects();

    }catch(e){
        console.error(e);
        document.getElementById("resultado").innerText="❌ Erro ao carregar dados";
    }
}
    
window.onload = carregarDados;
</script>

</body>
</html>
